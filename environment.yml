# Minimal environment for PELICAN.
#   conda env create -f environment.yml
#   conda activate pelican
#   pelican-setup
# Versions are pinned to the ones used in the paper, so results are reproducible.
# The full environment used in the paper is in envs/PELICAN_paper.yml
name: pelican
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - prokka=1.14.6
  - aragorn=1.2.41
  - blast=2.16.0
  - perl
  - wget
  - setuptools<81      # phanotate needs pkg_resources (removed in setuptools 81)
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.7.0
      - pandas==2.2.3
      - numpy==2.1.3
      - scipy==1.15.1
      - scikit-learn==1.6.1
      - matplotlib==3.9.2
      - biopython==1.84
      - pyrodigal==3.5.2
      - pyrodigal-gv==0.3.2
      - phanotate==1.6.6
      - hmmlearn==0.3.3
      - tqdm==4.66.6
      - mycolorpy==1.5.1
      - pygenomeviz==1.4.1
      - upsetplot==0.9.0
      - bcbio-gff==0.7.1
      - joblib==1.4.2
      - h5py==3.13.0
      - transformers==5.7.0
      - .
